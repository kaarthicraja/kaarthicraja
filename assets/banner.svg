<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300">
  <defs>
    <style>
      .mono { font-family: 'JetBrains Mono', 'IBM Plex Mono', 'Courier New', monospace; }
      .head { font-family: 'Arial Black', 'Segoe UI', Inter, sans-serif; font-weight: 900; }
      @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.15; } }
      .dot { animation: blink 1.6s step-end infinite; }
    </style>
  </defs>

  <rect width="1000" height="300" fill="#0a0a0a"/>

  <!-- Outer frame -->
  <rect x="16" y="16" width="968" height="268" fill="#0d0d0d" stroke="#2a2a2a" stroke-width="1"/>

  <!-- Slow mechanical scanline sweep -->
  <rect x="16" y="16" width="968" height="1" fill="#e8a33d" opacity="0">
    <animate attributeName="y" values="16;282;16" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.25;0" dur="10s" repeatCount="indefinite"/>
  </rect>

  <!-- Top meta rule -->
  <line x1="16" y1="46" x2="984" y2="46" stroke="#2a2a2a" stroke-width="1"/>
  <text x="36" y="35" class="mono" font-size="11" letter-spacing="2" fill="#8a8a8a">PROFILE // KAARTHIC-RAJA</text>
  <text x="964" y="35" class="mono" font-size="11" letter-spacing="2" fill="#8a8a8a" text-anchor="end">REV 2026.08</text>

  <!-- Bottom meta rule -->
  <line x1="16" y1="252" x2="984" y2="252" stroke="#2a2a2a" stroke-width="1"/>
  <text x="36" y="272" class="mono" font-size="11" letter-spacing="2" fill="#555555">LOCATION / REMOTE — INDIA</text>
  <text x="964" y="272" class="mono" font-size="11" letter-spacing="2" fill="#555555" text-anchor="end">CONTACT / OPEN</text>

  <!-- Headline -->
  <text x="40" y="140" class="head" font-size="62" letter-spacing="-2" fill="#eaeaea">KAARTHIC RAJA</text>
  <rect x="41" y="155" width="0" height="3" fill="#e8a33d">
    <animate attributeName="width" values="0;300;300" keyTimes="0;0.5;1" dur="6s" repeatCount="indefinite"/>
  </rect>
  <text x="41" y="188" class="mono" font-size="15" letter-spacing="3" fill="#e8a33d">CLOUD &amp; DEVOPS ENGINEER</text>

  <!-- Status readout -->
  <g transform="translate(700, 70)">
    <rect x="0" y="0" width="248" height="60" fill="none" stroke="#2a2a2a" stroke-width="1"/>
    <text x="14" y="20" class="mono" font-size="10" letter-spacing="2" fill="#555555">[ STATUS ]</text>
    <circle class="dot" cx="18" cy="41" r="4" fill="#4af626"/>
    <text x="30" y="45" class="mono" font-size="13" letter-spacing="1" fill="#eaeaea">AVAILABLE FOR HIRE</text>
  </g>
</svg>
