<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="500" height="320">
  <defs>
    <style>
      .mono { font-family: 'JetBrains Mono', 'IBM Plex Mono', 'Courier New', monospace; }
      @keyframes tl-blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
    </style>
  </defs>

  <rect width="500" height="320" fill="#0a0a0a"/>
  <rect x="0.5" y="0.5" width="499" height="319" fill="none" stroke="#2a2a2a"/>
  <text x="16" y="20" class="mono" font-size="10" letter-spacing="2" fill="#555555">[ CAREER LOG ]</text>
  <line x1="0" y1="30" x2="500" y2="30" stroke="#2a2a2a" stroke-width="1"/>

  <!-- Row 1 -->
  <line x1="0" y1="100" x2="500" y2="100" stroke="#2a2a2a" stroke-width="1"/>
  <rect x="16" y="42" width="8" height="8" fill="#e8a33d" style="animation: tl-blink 2s step-end infinite"/>
  <text x="36" y="50" class="mono" font-size="10" letter-spacing="1" fill="#555555">2023</text>
  <text x="16" y="68" class="mono" font-size="13" font-weight="bold" fill="#eaeaea">STARTED CLOUD ENGINEERING</text>
  <text x="16" y="86" class="mono" font-size="11" fill="#8a8a8a">AWS, Azure, GCP foundations laid</text>

  <!-- Row 2 -->
  <line x1="0" y1="170" x2="500" y2="170" stroke="#2a2a2a" stroke-width="1"/>
  <rect x="16" y="112" width="8" height="8" fill="#e8a33d" style="animation: tl-blink 2.4s step-end infinite"/>
  <text x="36" y="120" class="mono" font-size="10" letter-spacing="1" fill="#555555">2024</text>
  <text x="16" y="138" class="mono" font-size="13" font-weight="bold" fill="#eaeaea">MASTERED DEVOPS PIPELINE</text>
  <text x="16" y="156" class="mono" font-size="11" fill="#8a8a8a">Docker, Kubernetes, Terraform deployed</text>

  <!-- Row 3 -->
  <line x1="0" y1="240" x2="500" y2="240" stroke="#2a2a2a" stroke-width="1"/>
  <rect x="16" y="182" width="8" height="8" fill="#e8a33d" style="animation: tl-blink 2.8s step-end infinite"/>
  <text x="36" y="190" class="mono" font-size="10" letter-spacing="1" fill="#555555">2024</text>
  <text x="16" y="208" class="mono" font-size="13" font-weight="bold" fill="#eaeaea">FLUTTER APPS IN PRODUCTION</text>
  <text x="16" y="226" class="mono" font-size="11" fill="#8a8a8a">Cross-platform mobile dev, Firebase</text>

  <!-- Row 4 -->
  <rect x="16" y="252" width="8" height="8" fill="#4af626" style="animation: tl-blink 1.6s step-end infinite"/>
  <text x="36" y="260" class="mono" font-size="10" letter-spacing="1" fill="#555555">2025 — PRESENT</text>
  <text x="16" y="278" class="mono" font-size="13" font-weight="bold" fill="#eaeaea">AI AUTOMATION ENGINEERING</text>
  <text x="16" y="296" class="mono" font-size="11" fill="#8a8a8a">LLM pipelines, n8n, Python agents</text>
</svg>
