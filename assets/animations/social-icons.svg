<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 80" width="500" height="80">
  <defs>
    <style>
      .mono { font-family: 'JetBrains Mono', 'IBM Plex Mono', 'Courier New', monospace; }
      @keyframes sc-pulse { 0%, 100% { stroke: #2a2a2a; } 50% { stroke: #e8a33d; } }
    </style>
  </defs>

  <rect width="500" height="80" fill="#0a0a0a"/>

  <g transform="translate(10,10)">
    <rect x="0" y="0" width="110" height="60" fill="#141414" stroke="#2a2a2a" stroke-width="1" style="animation: sc-pulse 6s ease-in-out infinite; animation-delay:0s"/>
    <text x="55" y="34" class="mono" font-size="12" letter-spacing="1" fill="#eaeaea" text-anchor="middle">GITHUB</text>
  </g>
  <g transform="translate(130,10)">
    <rect x="0" y="0" width="110" height="60" fill="#141414" stroke="#2a2a2a" stroke-width="1" style="animation: sc-pulse 6s ease-in-out infinite; animation-delay:1.5s"/>
    <text x="55" y="34" class="mono" font-size="12" letter-spacing="1" fill="#eaeaea" text-anchor="middle">LINKEDIN</text>
  </g>
  <g transform="translate(250,10)">
    <rect x="0" y="0" width="110" height="60" fill="#141414" stroke="#2a2a2a" stroke-width="1" style="animation: sc-pulse 6s ease-in-out infinite; animation-delay:3s"/>
    <text x="55" y="34" class="mono" font-size="12" letter-spacing="1" fill="#eaeaea" text-anchor="middle">EMAIL</text>
  </g>
  <g transform="translate(370,10)">
    <rect x="0" y="0" width="110" height="60" fill="#141414" stroke="#2a2a2a" stroke-width="1" style="animation: sc-pulse 6s ease-in-out infinite; animation-delay:4.5s"/>
    <text x="55" y="34" class="mono" font-size="12" letter-spacing="1" fill="#eaeaea" text-anchor="middle">X / TWITTER</text>
  </g>
</svg>
