<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 60" width="900" height="60">
  <defs>
    <style>
      .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', 'Courier New', monospace; }
      .prompt { fill: #3b82f6; opacity: 0.7; }
      @keyframes tp-blink {
        0%, 100% { opacity: 1; }
        50%      { opacity: 0; }
      }
      .tp-cursor { animation: tp-blink 0.8s step-end infinite; }
    </style>

    <clipPath id="clip-r0"><rect x="185" y="12" height="34"><animate attributeName="width" keyTimes="0;0;0.001;0.05;1" values="0;0;0;425;425" dur="20s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="clip-r1"><rect x="185" y="12" height="34"><animate attributeName="width" keyTimes="0;0.25;0.251;0.3;1"  values="0;0;0;465;465" dur="20s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="clip-r2"><rect x="185" y="12" height="34"><animate attributeName="width" keyTimes="0;0.5;0.501;0.55;1" values="0;0;0;285;285" dur="20s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="clip-r3"><rect x="185" y="12" height="34"><animate attributeName="width" keyTimes="0;0.75;0.751;0.8;1" values="0;0;0;490;490" dur="20s" repeatCount="indefinite"/></rect></clipPath>
  </defs>

  <rect width="900" height="60" fill="#060a17"/>

  <text x="150" y="38" class="mono prompt" font-size="20" text-anchor="middle">&gt;</text>

  <!-- Role 1 -->
  <g opacity="0">
    <animate attributeName="opacity" keyTimes="0;0;0.001;0.23;0.25;1" values="0;0;1;1;0;0" dur="20s" repeatCount="indefinite"/>
    <g clip-path="url(#clip-r0)">
      <text x="185" y="38" class="mono" font-size="22" fill="#60a5fa" font-weight="bold">Cloud Engineer &amp; DevOps Architect</text>
    </g>
    <rect class="tp-cursor" x="608" y="15" width="10" height="26" fill="#60a5fa">
      <animate attributeName="x" keyTimes="0;0;0.001;0.05;1" values="185;185;185;608;608" dur="20s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Role 2 -->
  <g opacity="0">
    <animate attributeName="opacity" keyTimes="0;0.25;0.251;0.48;0.5;1" values="0;0;1;1;0;0" dur="20s" repeatCount="indefinite"/>
    <g clip-path="url(#clip-r1)">
      <text x="185" y="38" class="mono" font-size="22" fill="#22d3ee" font-weight="bold">Flutter Developer &amp; Mobile Architect</text>
    </g>
    <rect class="tp-cursor" x="648" y="15" width="10" height="26" fill="#22d3ee">
      <animate attributeName="x" keyTimes="0;0.25;0.251;0.3;1" values="185;185;185;648;648" dur="20s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Role 3 -->
  <g opacity="0">
    <animate attributeName="opacity" keyTimes="0;0.5;0.501;0.73;0.75;1" values="0;0;1;1;0;0" dur="20s" repeatCount="indefinite"/>
    <g clip-path="url(#clip-r2)">
      <text x="185" y="38" class="mono" font-size="22" fill="#93c5fd" font-weight="bold">AI Automation Engineer</text>
    </g>
    <rect class="tp-cursor" x="468" y="15" width="10" height="26" fill="#93c5fd">
      <animate attributeName="x" keyTimes="0;0.5;0.501;0.55;1" values="185;185;185;468;468" dur="20s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Role 4 -->
  <g opacity="0">
    <animate attributeName="opacity" keyTimes="0;0.75;0.751;0.98;1;1" values="0;0;1;1;0;0" dur="20s" repeatCount="indefinite"/>
    <g clip-path="url(#clip-r3)">
      <text x="185" y="38" class="mono" font-size="22" fill="#3b82f6" font-weight="bold">Linux Enthusiast &amp; Open Source Builder</text>
    </g>
    <rect class="tp-cursor" x="673" y="15" width="10" height="26" fill="#3b82f6">
      <animate attributeName="x" keyTimes="0;0.75;0.751;0.8;1" values="185;185;185;673;673" dur="20s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
