<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 60" width="900" height="60">
  <defs>
    <style>
      .mono { font-family: 'JetBrains Mono', 'IBM Plex Mono', 'Courier New', monospace; }
      @keyframes tp-blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
      .tp-cursor { animation: tp-blink 0.8s step-end infinite; }
    </style>

    <clipPath id="clip-r0"><rect x="150" y="12" height="34"><animate attributeName="width" keyTimes="0;0;0.001;0.05;1" values="0;0;0;480;480" dur="20s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="clip-r1"><rect x="150" y="12" height="34"><animate attributeName="width" keyTimes="0;0.25;0.251;0.3;1"  values="0;0;0;520;520" dur="20s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="clip-r2"><rect x="150" y="12" height="34"><animate attributeName="width" keyTimes="0;0.5;0.501;0.55;1" values="0;0;0;330;330" dur="20s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="clip-r3"><rect x="150" y="12" height="34"><animate attributeName="width" keyTimes="0;0.75;0.751;0.8;1" values="0;0;0;560;560" dur="20s" repeatCount="indefinite"/></rect></clipPath>
  </defs>

  <rect width="900" height="60" fill="#0a0a0a"/>
  <text x="120" y="38" class="mono" font-size="18" fill="#555555" text-anchor="middle">&gt;</text>

  <g opacity="0">
    <animate attributeName="opacity" keyTimes="0;0;0.001;0.23;0.25;1" values="0;0;1;1;0;0" dur="20s" repeatCount="indefinite"/>
    <g clip-path="url(#clip-r0)">
      <text x="150" y="38" class="mono" font-size="20" letter-spacing="1" fill="#e8a33d" font-weight="bold">CLOUD ENGINEER &amp; DEVOPS ARCHITECT</text>
    </g>
    <rect class="tp-cursor" x="630" y="15" width="10" height="26" fill="#e8a33d">
      <animate attributeName="x" keyTimes="0;0;0.001;0.05;1" values="150;150;150;630;630" dur="20s" repeatCount="indefinite"/>
    </rect>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" keyTimes="0;0.25;0.251;0.48;0.5;1" values="0;0;1;1;0;0" dur="20s" repeatCount="indefinite"/>
    <g clip-path="url(#clip-r1)">
      <text x="150" y="38" class="mono" font-size="20" letter-spacing="1" fill="#eaeaea" font-weight="bold">FLUTTER DEVELOPER &amp; MOBILE ARCHITECT</text>
    </g>
    <rect class="tp-cursor" x="670" y="15" width="10" height="26" fill="#eaeaea">
      <animate attributeName="x" keyTimes="0;0.25;0.251;0.3;1" values="150;150;150;670;670" dur="20s" repeatCount="indefinite"/>
    </rect>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" keyTimes="0;0.5;0.501;0.73;0.75;1" values="0;0;1;1;0;0" dur="20s" repeatCount="indefinite"/>
    <g clip-path="url(#clip-r2)">
      <text x="150" y="38" class="mono" font-size="20" letter-spacing="1" fill="#8a8a8a" font-weight="bold">AI AUTOMATION ENGINEER</text>
    </g>
    <rect class="tp-cursor" x="480" y="15" width="10" height="26" fill="#8a8a8a">
      <animate attributeName="x" keyTimes="0;0.5;0.501;0.55;1" values="150;150;150;480;480" dur="20s" repeatCount="indefinite"/>
    </rect>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" keyTimes="0;0.75;0.751;0.98;1;1" values="0;0;1;1;0;0" dur="20s" repeatCount="indefinite"/>
    <g clip-path="url(#clip-r3)">
      <text x="150" y="38" class="mono" font-size="20" letter-spacing="1" fill="#e8a33d" font-weight="bold">LINUX ENTHUSIAST &amp; OPEN SOURCE BUILDER</text>
    </g>
    <rect class="tp-cursor" x="710" y="15" width="10" height="26" fill="#e8a33d">
      <animate attributeName="x" keyTimes="0;0.75;0.751;0.8;1" values="150;150;150;710;710" dur="20s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
