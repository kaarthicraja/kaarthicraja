<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 140" width="900" height="140">
  <defs>
    <linearGradient id="hb-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#060a17"/>
      <stop offset="50%"  stop-color="#0a1428"/>
      <stop offset="100%" stop-color="#060a17"/>
    </linearGradient>

    <radialGradient id="hb-glow" cx="50%" cy="50%" r="60%">
      <stop offset="0%"  stop-color="#3b82f6" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>

    <pattern id="hb-grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M 42 0 L 0 0 0 42" fill="none" stroke="#3b82f6" stroke-width="1" stroke-opacity="0.07"/>
    </pattern>
  </defs>

  <rect width="100%" height="100%" fill="url(#hb-bg)"/>
  <rect width="100%" height="100%" fill="url(#hb-grid)"/>

  <ellipse cx="450" cy="70" rx="420" ry="80" fill="url(#hb-glow)">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="6s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Slow horizontal scan line -->
  <rect x="0" y="0" width="900" height="1" fill="#60a5fa" opacity="0">
    <animate attributeName="y" values="-4;144;-4" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.14;0" dur="9s" repeatCount="indefinite"/>
  </rect>

  <!-- A few slow, subtle drifting motes -->
  <g fill="#60a5fa">
    <circle cx="120" cy="110" r="1.6" opacity="0.5">
      <animate attributeName="cy" values="110;30" dur="14s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.5;0" dur="14s" repeatCount="indefinite"/>
    </circle>
    <circle cx="460" cy="120" r="1.4" opacity="0.4">
      <animate attributeName="cy" values="120;20" dur="17s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.4;0" dur="17s" repeatCount="indefinite"/>
    </circle>
    <circle cx="780" cy="115" r="1.8" opacity="0.5">
      <animate attributeName="cy" values="115;25" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.5;0" dur="12s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
