<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 280" width="700" height="280">
  <defs>
    <style>
      .mono { font-family: 'JetBrains Mono', 'IBM Plex Mono', 'Courier New', monospace; }
      @keyframes db-blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.2; } }
    </style>
  </defs>

  <rect width="700" height="280" fill="#0a0a0a"/>
  <rect x="0.5" y="0.5" width="699" height="279" fill="none" stroke="#2a2a2a"/>

  <!-- Header -->
  <line x1="0" y1="34" x2="700" y2="34" stroke="#2a2a2a" stroke-width="1"/>
  <text x="16" y="22" class="mono" font-size="12" letter-spacing="2" fill="#eaeaea">[ ENGINEERING METRICS ]</text>
  <circle cx="672" cy="17" r="4" fill="#4af626" style="animation: db-blink 1.8s step-end infinite"/>
  <text x="654" y="21" class="mono" font-size="10" letter-spacing="1" fill="#4af626" text-anchor="end">LIVE</text>

  <!-- Metric rows -->
  <g class="mono" font-size="11" letter-spacing="1" fill="#8a8a8a">
    <text x="20" y="62">DEPLOY</text>
    <text x="20" y="96">UPTIME</text>
    <text x="20" y="130">AUTOMATION</text>
    <text x="20" y="164">BUILD TIME</text>
  </g>

  <rect x="150" y="50" width="430" height="12" fill="#141414" stroke="#2a2a2a" stroke-width="1"/>
  <rect x="150" y="50" width="0" height="12" fill="#e8a33d">
    <animate attributeName="width" values="410;418;404;416;410" keyTimes="0;0.25;0.5;0.75;1" dur="8s" repeatCount="indefinite"/>
  </rect>
  <text x="620" y="62" class="mono" font-size="11" fill="#eaeaea" text-anchor="end">98%</text>

  <rect x="150" y="84" width="430" height="12" fill="#141414" stroke="#2a2a2a" stroke-width="1"/>
  <rect x="150" y="84" width="0" height="12" fill="#e8a33d">
    <animate attributeName="width" values="422;424;420;423;422" keyTimes="0;0.25;0.5;0.75;1" dur="10s" repeatCount="indefinite"/>
  </rect>
  <text x="620" y="96" class="mono" font-size="11" fill="#eaeaea" text-anchor="end">99.9%</text>

  <rect x="150" y="118" width="430" height="12" fill="#141414" stroke="#2a2a2a" stroke-width="1"/>
  <rect x="150" y="118" width="0" height="12" fill="#e8a33d">
    <animate attributeName="width" values="365;381;350;372;365" keyTimes="0;0.25;0.5;0.75;1" dur="6s" repeatCount="indefinite"/>
  </rect>
  <text x="620" y="130" class="mono" font-size="11" fill="#eaeaea" text-anchor="end">
    <animate attributeName="textContent" values="85%;89%;82%;87%;85%" keyTimes="0;0.25;0.5;0.75;1" dur="6s" repeatCount="indefinite"/>85%
  </text>

  <rect x="150" y="152" width="430" height="12" fill="#141414" stroke="#2a2a2a" stroke-width="1"/>
  <rect x="150" y="152" width="0" height="12" fill="#e8a33d">
    <animate attributeName="width" values="140;154;131;148;140" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/>
  </rect>
  <text x="620" y="164" class="mono" font-size="11" fill="#eaeaea" text-anchor="end">3M 40S</text>

  <!-- Divider -->
  <line x1="0" y1="185" x2="700" y2="185" stroke="#2a2a2a" stroke-width="1"/>
  <line x1="175" y1="185" x2="175" y2="280" stroke="#2a2a2a" stroke-width="1"/>
  <line x1="350" y1="185" x2="350" y2="280" stroke="#2a2a2a" stroke-width="1"/>
  <line x1="525" y1="185" x2="525" y2="280" stroke="#2a2a2a" stroke-width="1"/>

  <!-- Stats row -->
  <text x="20"  y="210" class="mono" font-size="10" letter-spacing="1" fill="#555555">EXPERIENCE</text>
  <text x="20"  y="230" class="mono" font-size="16" font-weight="bold" fill="#eaeaea">3+ YEARS</text>

  <text x="195" y="210" class="mono" font-size="10" letter-spacing="1" fill="#555555">PROJECTS SHIPPED</text>
  <text x="195" y="230" class="mono" font-size="16" font-weight="bold" fill="#eaeaea">
    <animate attributeName="textContent" values="24;25;23;24;24" keyTimes="0;0.25;0.5;0.75;1" dur="7s" repeatCount="indefinite"/>24
  </text>

  <text x="370" y="210" class="mono" font-size="10" letter-spacing="1" fill="#555555">CONTAINERS</text>
  <text x="370" y="230" class="mono" font-size="16" font-weight="bold" fill="#eaeaea">
    <animate attributeName="textContent" values="12 UP;12 UP;13 UP;12 UP;12 UP" keyTimes="0;0.25;0.5;0.75;1" dur="9s" repeatCount="indefinite"/>12 UP
  </text>

  <text x="545" y="210" class="mono" font-size="10" letter-spacing="1" fill="#555555">STATUS</text>
  <text x="545" y="230" class="mono" font-size="16" font-weight="bold" fill="#e8a33d">AVAILABLE</text>

  <!-- Activity mini-graph -->
  <line x1="0" y1="245" x2="700" y2="245" stroke="#2a2a2a" stroke-width="1"/>
  <text x="20" y="264" class="mono" font-size="10" letter-spacing="1" fill="#555555">COMMITS/WK</text>
  <g transform="translate(200, 250)">
    <rect x="0"   y="8"  width="12" height="20" fill="#141414" stroke="#2a2a2a"/>
    <rect x="0"   y="16" width="12" height="12" fill="#e8a33d"><animate attributeName="height" values="12;18;10;15;12" dur="4s" repeatCount="indefinite"/><animate attributeName="y" values="16;10;18;13;16" dur="4s" repeatCount="indefinite"/></rect>
    <rect x="16"  y="8"  width="12" height="20" fill="#141414" stroke="#2a2a2a"/>
    <rect x="16"  y="13" width="12" height="15" fill="#e8a33d"><animate attributeName="height" values="15;8;20;12;15" dur="5s" repeatCount="indefinite"/><animate attributeName="y" values="13;20;8;16;13" dur="5s" repeatCount="indefinite"/></rect>
    <rect x="32"  y="8"  width="12" height="20" fill="#141414" stroke="#2a2a2a"/>
    <rect x="32"  y="18" width="12" height="10" fill="#e8a33d"><animate attributeName="height" values="10;16;6;14;10" dur="3s" repeatCount="indefinite"/><animate attributeName="y" values="18;12;22;14;18" dur="3s" repeatCount="indefinite"/></rect>
    <rect x="48"  y="8"  width="12" height="20" fill="#141414" stroke="#2a2a2a"/>
    <rect x="48"  y="11" width="12" height="17" fill="#e8a33d"><animate attributeName="height" values="17;10;20;8;17" dur="6s" repeatCount="indefinite"/><animate attributeName="y" values="11;18;8;20;11" dur="6s" repeatCount="indefinite"/></rect>
    <rect x="64"  y="8"  width="12" height="20" fill="#141414" stroke="#2a2a2a"/>
    <rect x="64"  y="15" width="12" height="13" fill="#e8a33d"><animate attributeName="height" values="13;20;8;16;13" dur="4.5s" repeatCount="indefinite"/><animate attributeName="y" values="15;8;20;12;15" dur="4.5s" repeatCount="indefinite"/></rect>
    <rect x="80"  y="8"  width="12" height="20" fill="#141414" stroke="#2a2a2a"/>
    <rect x="80"  y="10" width="12" height="18" fill="#eaeaea" opacity="0.8"><animate attributeName="height" values="18;12;20;6;18" dur="5.5s" repeatCount="indefinite"/><animate attributeName="y" values="10;16;8;22;10" dur="5.5s" repeatCount="indefinite"/></rect>
    <rect x="96"  y="8"  width="12" height="20" fill="#141414" stroke="#2a2a2a"/>
    <rect x="96"  y="17" width="12" height="11" fill="#e8a33d"><animate attributeName="height" values="11;18;5;15;11" dur="3.5s" repeatCount="indefinite"/><animate attributeName="y" values="17;10;23;13;17" dur="3.5s" repeatCount="indefinite"/></rect>
    <rect x="112" y="8"  width="12" height="20" fill="#141414" stroke="#2a2a2a"/>
    <rect x="112" y="12" width="12" height="16" fill="#e8a33d"><animate attributeName="height" values="16;9;20;11;16" dur="4s" repeatCount="indefinite"/><animate attributeName="y" values="12;19;8;17;12" dur="4s" repeatCount="indefinite"/></rect>
    <rect x="128" y="8"  width="12" height="20" fill="#141414" stroke="#2a2a2a"/>
    <rect x="128" y="14" width="12" height="14" fill="#e8a33d"><animate attributeName="height" values="14;20;7;17;14" dur="6s" repeatCount="indefinite"/><animate attributeName="y" values="14;8;21;11;14" dur="6s" repeatCount="indefinite"/></rect>
    <rect x="144" y="8"  width="12" height="20" fill="#141414" stroke="#2a2a2a"/>
    <rect x="144" y="9"  width="12" height="19" fill="#e8a33d"><animate attributeName="height" values="19;11;20;8;19" dur="3s" repeatCount="indefinite"/><animate attributeName="y" values="9;17;8;20;9" dur="3s" repeatCount="indefinite"/></rect>
  </g>
</svg>
