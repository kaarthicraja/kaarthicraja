  <line x1="336" y1="28" x2="336" y2="200" stroke="#2a2a2a" stroke-width="1"/>
  <line x1="504" y1="28" x2="504" y2="200" stroke="#2a2a2a" stroke-width="1"/>
  <line x1="672" y1="28" x2="672" y2="200" stroke="#2a2a2a" stroke-width="1"/>
  <line x1="0" y1="114" x2="840" y2="114" stroke="#2a2a2a" stroke-width="1"/>

  <!-- Row 1 -->
  <g transform="translate(0,28)">
