  </defs>

  <rect width="840" height="200" fill="#0a0a0a"/>
  <rect x="0.5" y="0.5" width="839" height="199" fill="none" stroke="#2a2a2a"/>
  <text x="16" y="18" class="mono" font-size="10" letter-spacing="2" fill="#555555">[ STACK ]</text>
  <line x1="0" y1="28" x2="840" y2="28" stroke="#2a2a2a" stroke-width="1"/>

  <!-- Grid lines: 5 cols, 2 rows below header -->
