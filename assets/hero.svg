<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 300" width="840" height="300">
  <defs>
    <style>
      .sans { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, 'JetBrains Mono', Consolas, 'Liberation Mono', 'DejaVu Sans Mono', monospace; }
      @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
      .cur { animation: blink 0.9s step-end infinite; }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
      .live { animation: pulse 1.8s ease-in-out infinite; }
    </style>
  </defs>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
    <path d="M24 0H0V24" fill="none" stroke="#1a1a1a" stroke-width="1"/>
  </pattern>
  <rect width="840" height="300" fill="#0a0a0a"/>
  <rect x="0.5" y="0.5" width="839" height="299" fill="none" stroke="#262626"/>
  <rect x="1" y="47" width="838" height="210" fill="url(#grid)" opacity="0.6"/>

  <text x="32" y="30" class="mono" font-size="12" letter-spacing="2" fill="#7a7a7a">PROFILE / KAARTHICRAJA</text>
  <circle class="live" cx="720" cy="26" r="4" fill="#4af626"/>
  <text x="808" y="30" class="mono" font-size="12" letter-spacing="2" fill="#f2f2f2" text-anchor="end">BUILDING</text>
  <line x1="1" y1="46" x2="839" y2="46" stroke="#262626"/>

  <text x="30" y="122" class="sans" font-size="54" font-weight="800" letter-spacing="-1.5" fill="#f2f2f2">KAARTHIC RAJA</text>
  <rect x="32" y="138" height="3" width="0" fill="#e8a33d">
    <animate attributeName="width" values="0;132;132" keyTimes="0;0.25;1" dur="8s" repeatCount="indefinite"/>
  </rect>
  <text x="32" y="178" class="sans" font-size="21" font-weight="600" fill="#e8a33d">AI &amp; Automation Engineer<tspan fill="#b8b8b8" font-weight="400"> · Full-Stack Developer</tspan></text>

  <text x="32" y="224" class="mono" font-size="15" fill="#e8a33d">$</text>
  <clipPath id="tp0"><rect x="54" y="206" height="26" width="0">
    <animate attributeName="width" dur="16s" repeatCount="indefinite"
      keyTimes="0;0;0.075;1" values="0;0;333;333"/>
  </rect></clipPath>
  <g opacity="0">
    <animate attributeName="opacity" dur="16s" repeatCount="indefinite"
      keyTimes="0;0;0.0001;0.23;0.25;1" values="0;0;1;1;0;0"/>
    <text x="54" y="224" class="mono" font-size="15" fill="#f2f2f2" textLength="333" lengthAdjust="spacingAndGlyphs" clip-path="url(#tp0)">building LLM agents that do real work</text>
    <rect class="cur" y="210" width="9" height="18" fill="#e8a33d" x="54">
      <animate attributeName="x" dur="16s" repeatCount="indefinite"
        keyTimes="0;0;0.075;1" values="54;54;390;390"/>
    </rect>
  </g>
  <clipPath id="tp1"><rect x="54" y="206" height="26" width="0">
    <animate attributeName="width" dur="16s" repeatCount="indefinite"
      keyTimes="0;0.25;0.325;1" values="0;0;306;306"/>
  </rect></clipPath>
  <g opacity="0">
    <animate attributeName="opacity" dur="16s" repeatCount="indefinite"
      keyTimes="0;0.25;0.2501;0.48;0.5;1" values="0;0;1;1;0;0"/>
    <text x="54" y="224" class="mono" font-size="15" fill="#f2f2f2" textLength="306" lengthAdjust="spacingAndGlyphs" clip-path="url(#tp1)">turning voice notes into documents</text>
    <rect class="cur" y="210" width="9" height="18" fill="#e8a33d" x="54">
      <animate attributeName="x" dur="16s" repeatCount="indefinite"
        keyTimes="0;0.25;0.325;1" values="54;54;363;363"/>
    </rect>
  </g>
  <clipPath id="tp2"><rect x="54" y="206" height="26" width="0">
    <animate attributeName="width" dur="16s" repeatCount="indefinite"
      keyTimes="0;0.5;0.575;1" values="0;0;315;315"/>
  </rect></clipPath>
  <g opacity="0">
    <animate attributeName="opacity" dur="16s" repeatCount="indefinite"
      keyTimes="0;0.5;0.5001;0.73;0.75;1" values="0;0;1;1;0;0"/>
    <text x="54" y="224" class="mono" font-size="15" fill="#f2f2f2" textLength="315" lengthAdjust="spacingAndGlyphs" clip-path="url(#tp2)">automating WhatsApp &amp; n8n workflows</text>
    <rect class="cur" y="210" width="9" height="18" fill="#e8a33d" x="54">
      <animate attributeName="x" dur="16s" repeatCount="indefinite"
        keyTimes="0;0.5;0.575;1" values="54;54;372;372"/>
    </rect>
  </g>
  <clipPath id="tp3"><rect x="54" y="206" height="26" width="0">
    <animate attributeName="width" dur="16s" repeatCount="indefinite"
      keyTimes="0;0.75;0.825;1" values="0;0;306;306"/>
  </rect></clipPath>
  <g opacity="0">
    <animate attributeName="opacity" dur="16s" repeatCount="indefinite"
      keyTimes="0;0.75;0.7501;0.98;0.9999;1" values="0;0;1;1;0;0"/>
    <text x="54" y="224" class="mono" font-size="15" fill="#f2f2f2" textLength="306" lengthAdjust="spacingAndGlyphs" clip-path="url(#tp3)">shipping Next.js + TypeScript apps</text>
    <rect class="cur" y="210" width="9" height="18" fill="#e8a33d" x="54">
      <animate attributeName="x" dur="16s" repeatCount="indefinite"
        keyTimes="0;0.75;0.825;1" values="54;54;363;363"/>
    </rect>
  </g>

  <line x1="706" y1="114" x2="706" y2="138" stroke="#262626"/>
  <circle cx="706" r="3" fill="#e8a33d">
    <animate attributeName="cy" values="114;138" dur="1.6s" begin="0s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="1.6s" begin="0s" repeatCount="indefinite"/>
  </circle>
  <line x1="706" y1="184" x2="706" y2="208" stroke="#262626"/>
  <circle cx="706" r="3" fill="#e8a33d">
    <animate attributeName="cy" values="184;208" dur="1.6s" begin="0.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="1.6s" begin="0.8s" repeatCount="indefinite"/>
  </circle>
  <g transform="translate(604,68)">
    <rect width="204" height="46" fill="#0f0f0f" stroke="#262626"/>
    <text x="14" y="18" class="mono" font-size="10" letter-spacing="2" fill="#5a5a5a">INPUT</text>
    <text x="14" y="36" class="sans" font-size="14" fill="#f2f2f2">voice note · chat</text>
  </g>
  <g transform="translate(604,138)">
    <rect width="204" height="46" fill="#0f0f0f" stroke="#e8a33d"/>
    <text x="14" y="18" class="mono" font-size="10" letter-spacing="2" fill="#e8a33d">AGENT</text>
    <text x="14" y="36" class="sans" font-size="14" fill="#f2f2f2">LLM · tool calls</text>
  </g>
  <g transform="translate(604,208)">
    <rect width="204" height="46" fill="#0f0f0f" stroke="#262626"/>
    <text x="14" y="18" class="mono" font-size="10" letter-spacing="2" fill="#5a5a5a">OUTPUT</text>
    <text x="14" y="36" class="sans" font-size="14" fill="#f2f2f2">PDF · CRM · reply</text>
  </g>

  <line x1="1" y1="258" x2="839" y2="258" stroke="#262626"/>
  <text x="32" y="284" class="mono" font-size="12" letter-spacing="2" fill="#7a7a7a">INDIA · TAMIL / ENGLISH</text>
  <text x="808" y="284" class="mono" font-size="12" letter-spacing="1" fill="#7a7a7a" text-anchor="end">github.com/kaarthicraja</text>
