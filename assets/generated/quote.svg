<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 146" width="800" height="146">
  <defs>
    <style>.mono { font-family: 'JetBrains Mono', 'IBM Plex Mono', 'Courier New', monospace; }</style>
  </defs>

  <!-- Background -->
  <rect width="800" height="146" fill="#0a0a0a"/>
  <rect x="0.5" y="0.5" width="799" height="145" fill="none" stroke="#2a2a2a" stroke-width="1"/>

  <!-- Left accent bar -->
  <rect x="0" y="0" width="4" height="146" fill="#e8a33d"/>

  <text x="18" y="24" class="mono" font-size="10" letter-spacing="2" fill="#555555">[ DAILY QUOTE ]</text>

  <!-- Quote text -->
  <text x="60" y="58" class="mono" font-size="18" fill="#eaeaea" font-weight="bold">
    <tspan x="60" dy="0">Before software can be reusable it first has to be</tspan><tspan x="60" dy="28">usable.</tspan>
  </text>

  <!-- Author -->
  <text x="750" y="124" class="mono" font-size="14" letter-spacing="1" fill="#e8a33d"
        text-anchor="end">— RALPH JOHNSON</text>
</svg>